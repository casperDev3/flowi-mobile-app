# Supply a unique NOTE_TITLE via -e for each run.
# Local audit account only. Launch a Release build and authenticate against the local workspace first.
# Run sequentially on iPad/iPhone with MAESTRO_DRIVER_STARTUP_TIMEOUT=300000.
appId: com.casper3.f-tracking-app
---
- launchApp
- openLink: ftrackingapp://notes
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: notes-add
    timeout: 30000
- tapOn:
    id: notes-search
- eraseText
- tapOn:
    id: notes-add
- tapOn:
    id: notes-title
- inputText: ${NOTE_TITLE}
- tapOn:
    id: notes-body
- inputText: Draft survives save and reopen
- tapOn:
    id: notes-save
# After save the note stays open in read mode (notes-reader), not in the editor.
- extendedWaitUntil:
    visible:
      id: notes-reader
    timeout: 10000
- assertVisible: ${NOTE_TITLE}
- tapOn:
    id: notes-close
- tapOn:
    id: notes-search
- eraseText
- inputText: ${NOTE_TITLE}
# Tapping a note opens the reader; the editor only opens via notes-edit.
- tapOn:
    id: "note-.*"
- assertVisible:
    id: notes-reader
- assertVisible: Draft survives save and reopen
- tapOn:
    id: notes-edit
- assertVisible:
    id: notes-editor
- tapOn:
    id: notes-close
- tapOn:
    id: notes-search
- eraseText
- inputText: no-match-982716
- assertNotVisible: ${NOTE_TITLE}
- eraseText
- inputText: ${NOTE_TITLE}
- tapOn:
    id: "note-.*"
- tapOn:
    id: notes-delete
- tapOn:
    text: Видалити
    below: "Видалити цю нотатку.*"
- tapOn:
    id: notes-search
- eraseText
- assertNotVisible: ${NOTE_TITLE}
